name: smartattend_flutter
description: "SmartAttend — Умная система учёта посещаемости для университетов"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  animate_do: ^5.1.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.15


flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/logo.png

