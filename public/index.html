<!DOCTYPE html>

<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smartattend_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Cache-Busting Headers for instant live updates -->

  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>SmartAttend — Ақылды Қатысу Жүйесі</title>
  <link rel="manifest" href="manifest.json">
  <!-- SmartAttend Page Transition Loader & Transparent Stickers -->
  <link rel="stylesheet" href="page_loader.css">
</head>
<body>
  <!-- Auto-clear stale ServiceWorker caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) caches.delete(name);
      });
    }
  </script>
  <!-- Page Loader Component Script -->
  <script src="page_loader.js"></script>
  <script src="flutter_bootstrap.js?v=20261011_v4" async></script>
</body>
</html>
